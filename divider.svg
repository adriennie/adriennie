<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="1000" height="40" role="presentation">
  <style>
    .pulse{animation:p 4s ease-in-out infinite;transform-origin:500px 20px}
    @keyframes p{50%{transform:rotate(45deg) scale(1.15)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset=".2" stop-color="#7c3aed"/>
      <stop offset=".45" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#4ade80"/>
      <stop offset=".8" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset=".35" stop-color="#22d3ee"/>
      <stop offset=".65" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect x="40" y="19" width="920" height="2" rx="1" fill="url(#l)"/>
  <g class="pulse">
    <rect x="490" y="10" width="20" height="20" rx="4" fill="#0b0b16" stroke="url(#d)" stroke-width="2.5" transform="rotate(45 500 20)"/>
    <circle cx="500" cy="20" r="3" fill="#f5f3ff"/>
  </g>
</svg>
