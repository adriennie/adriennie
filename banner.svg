<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2B1810"/><stop offset="0.55" stop-color="#7B2D26"/><stop offset="1" stop-color="#D2691E"/>
</linearGradient>
<radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#F0B35A" stop-opacity="0.95"/><stop offset="1" stop-color="#F0B35A" stop-opacity="0"/>
</radialGradient>
<clipPath id="r"><rect width="1000" height="320" rx="18"/></clipPath>
</defs>
<style>
.f{animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
.s{animation-name:sway;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
@keyframes fall{0%{transform:translateY(-40px) rotate(0deg);opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:translateY(350px) rotate(var(--r));opacity:0}}
@keyframes sway{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes glow{from{opacity:.75}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.sun{animation:glow 4s ease-in-out infinite alternate}
.t1{animation:rise 1.4s ease-out both}
.t2{animation:rise 1.4s .5s ease-out both}
.t3{animation:rise 1.4s 1s ease-out both}
</style>
