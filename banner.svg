<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420" role="img" aria-label="Adrika Pradhan: MSc AI, USI Lugano, ML systems. Models are the easy half; everything around them is the work.">
  <style>
    .sheen{animation:sheen 6s ease-in-out infinite}
    @keyframes sheen{0%{transform:translateX(-700px)}55%,100%{transform:translateX(1500px)}}
    .float{animation:float 7s ease-in-out infinite}
    .float2{animation:float 9s ease-in-out infinite reverse}
    @keyframes float{50%{transform:translateY(-10px)}}
    .twinkle{animation:tw 3.2s ease-in-out infinite}
    .twinkle.b{animation-delay:1.1s}.twinkle.c{animation-delay:2.2s}
    @keyframes tw{50%{opacity:.15}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset=".35" stop-color="#22d3ee"/>
      <stop offset=".65" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="foilText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset=".4" stop-color="#a5f3fc"/>
      <stop offset=".7" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".2" cy=".15" r=".55">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".85" cy=".9" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx=".95" cy=".05" r=".35">
      <stop offset="0" stop-color="#f472b6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a5b4fc" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="6" y="6" width="1388" height="408" rx="30"/></clipPath>
  </defs>

  <!-- foil border -->
  <rect x="0" y="0" width="1400" height="420" rx="36" fill="url(#foil)"/>
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1400" height="420" fill="#0b0b16"/>
    <rect x="0" y="0" width="1400" height="420" fill="url(#grid)"/>
    <rect x="0" y="0" width="1400" height="420" fill="url(#glowA)"/>
    <rect x="0" y="0" width="1400" height="420" fill="url(#glowB)"/>
    <rect x="0" y="0" width="1400" height="420" fill="url(#glowC)"/>

    <!-- floating holo shards -->
    <g class="float" opacity=".55">
      <path d="M150 90 l26 -14 l18 26 l-26 14z" fill="url(#foil)"/>
      <path d="M1210 300 l34 -18 l22 32 l-34 18z" fill="url(#foil)"/>
    </g>
    <g class="float2" opacity=".4">
      <path d="M1180 80 l16 -9 l11 16 l-16 9z" fill="url(#foil)"/>
      <path d="M210 310 l20 -11 l14 20 l-20 11z" fill="url(#foil)"/>
      <path d="M1290 170 l12 -7 l8 12 l-12 7z" fill="url(#foil)"/>
    </g>

    <!-- sparkles -->
    <g fill="#f5f3ff">
      <path class="twinkle" d="M330 120 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3z"/>
      <path class="twinkle b" d="M1080 110 l2.5 7 l7 2.5 l-7 2.5 l-2.5 7 l-2.5 -7 l-7 -2.5 l7 -2.5z"/>
      <path class="twinkle c" d="M1040 330 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2z"/>
      <path class="twinkle b" d="M110 220 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2z"/>
    </g>

    <!-- card label -->
    <text x="700" y="112" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="18" font-weight="700" letter-spacing=".35em" fill="#7dd3fc">PLAYER CARD · 001</text>

    <!-- name -->
    <text x="700" y="218" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif" font-size="96" font-weight="800" letter-spacing="-.02em" fill="url(#foilText)">Adrika Pradhan</text>

    <!-- subtitle -->
    <text x="700" y="272" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="700" letter-spacing=".22em" fill="#a5b4fc">MSc AI · USI LUGANO · ML SYSTEMS</text>

    <!-- tagline chip -->
    <rect x="370" y="306" width="660" height="48" rx="24" fill="#f5f3ff" fill-opacity=".05" stroke="url(#foil)" stroke-opacity=".7" stroke-width="1.5"/>
    <text x="700" y="337" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif" font-size="19" font-style="italic" fill="#f5f3ff" fill-opacity=".85">models are the easy half. everything around them is the work.</text>

    <!-- moving sheen -->
    <g class="sheen"><rect x="0" y="-60" width="260" height="540" fill="url(#sheenGrad)" transform="skewX(-20)"/></g>
  </g>
</svg>
